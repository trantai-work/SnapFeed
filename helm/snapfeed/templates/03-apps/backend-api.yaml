apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapfeed-api
  namespace: {{ .Values.global.namespace }}
  labels:
    app: snapfeed-api
    {{- include "snapfeed.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: snapfeed-api
  template:
    metadata:
      labels:
        app: snapfeed-api
    spec:
      {{- if .Values.serviceAccount.api.create }}
      serviceAccountName: {{ .Values.serviceAccount.api.name }}
      {{- end }}
      containers:
      - name: api
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.api.port }}
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.api.port }}
          initialDelaySeconds: 10
          periodSeconds: 5
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
        envFrom:
        - configMapRef:
            name: snapfeed-api-config
        - secretRef:
            name: snapfeed-api-secret
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: snapfeed-api-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: snapfeed-api
    {{- include "snapfeed.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: snapfeed-api
  ports:
  - port: {{ .Values.api.port }}
    targetPort: {{ .Values.api.port }}
