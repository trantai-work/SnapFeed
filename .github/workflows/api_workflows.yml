name: Deploy API

on:
  push:
    tags:
      - 'api-*'

concurrency:
  group: api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/snapfeed-api
          TAG=${GITHUB_REF#refs/tags/}
          docker build -f ./snapfeed-api/Dockerfile.prod -t $IMAGE:$TAG -t $IMAGE:latest ./snapfeed-api
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SNAPFEED_EC2_HOST }}
          username: ${{ secrets.SNAPFEED_EC2_USERNAME }}
          key: ${{ secrets.SNAPFEED_EC2_KEY }}
          script: |
            cd /home/ec2-user/SnapFeed

            echo "Deploying API (${{ github.ref_name }} → Docker Hub :latest on EC2)"
            echo "Compose images must use :latest (no API_TAG placeholder)."

            docker-compose pull api

            docker-compose up -d --force-recreate db api

            docker-compose run --rm api python manage.py migrate

            echo "==== Containers status ===="
            docker ps
            docker-compose logs api --tail=50