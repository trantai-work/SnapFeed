name: Deploy API

on:
  push:
    tags:
      - 'api-*'

concurrency:
  group: api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/snapfeed-api
          TAG=${GITHUB_REF#refs/tags/}
          docker build -f ./snapfeed-api/Dockerfile.prod -t $IMAGE:$TAG -t $IMAGE:latest ./snapfeed-api
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name sp --region ap-southeast-1

      - name: Deploy API with Helm
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          helm upgrade snapfeed ./helm/snapfeed -n snapfeed --reuse-values --set api.image.tag=$TAG

      - name: Run Database Migrations
        run: |
          kubectl rollout status deployment/snapfeed-api -n snapfeed --timeout=180s
          POD_NAME=$(kubectl get pods -n snapfeed -l app=snapfeed-api -o jsonpath="{.items[0].metadata.name}")
          kubectl exec -n snapfeed $POD_NAME -- python manage.py migrate
          kubectl exec -n snapfeed $POD_NAME -- python manage.py seed_groups_permissions