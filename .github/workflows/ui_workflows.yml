name: Deploy UI

on:
  push:
    tags:
      - 'ui-*'

concurrency:
  group: ui
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/snapfeed-ui
          TAG=${GITHUB_REF#refs/tags/}
          docker build \
            --build-arg VITE_API_URL="${{ vars.VITE_API_URL }}" \
            --build-arg VITE_WS_URL="${{ vars.VITE_WS_URL }}" \
            --build-arg VITE_DEFAULT_LANG="${{ vars.VITE_DEFAULT_LANG }}" \
            --build-arg VITE_FACEBOOK_APP_ID="${{ vars.VITE_FACEBOOK_APP_ID }}" \
            --build-arg VITE_FACEBOOK_AUTH_URL="${{ vars.VITE_FACEBOOK_AUTH_URL }}" \
            --build-arg VITE_FACEBOOK_REDIRECT_URI="${{ vars.VITE_FACEBOOK_REDIRECT_URI }}" \
            --build-arg VITE_GOOGLE_AUTH_URL="${{ vars.VITE_GOOGLE_AUTH_URL }}" \
            --build-arg VITE_GOOGLE_CLIENT_ID="${{ vars.VITE_GOOGLE_CLIENT_ID }}" \
            --build-arg VITE_GOOGLE_REDIRECT_URI="${{ vars.VITE_GOOGLE_REDIRECT_URI }}" \
            --build-arg VITE_S3_BUCKET_URL="${{ vars.VITE_S3_BUCKET_URL }}" \
            --build-arg VITE_TURN_SERVER_URL="${{ vars.VITE_TURN_SERVER_URL }}" \
            --build-arg VITE_TURN_USER="${{ vars.VITE_TURN_USER }}" \
            --build-arg VITE_TURN_PASS="${{ vars.VITE_TURN_PASS }}" \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" \
            ./snapfeed-ui
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SNAPFEED_EC2_HOST }}
          username: ${{ secrets.SNAPFEED_EC2_USERNAME }}
          key: ${{ secrets.SNAPFEED_EC2_KEY }}
          script: |
            cd /home/ec2-user/SnapFeed

            echo "Deploying UI (${{ github.ref_name }} → Docker Hub :latest on EC2)"
            echo "Compose images must use :latest (no UI_TAG placeholder)."

            docker-compose pull ui

            docker-compose up -d --force-recreate ui

            echo "==== Containers status ===="
            docker ps
            docker-compose logs ui --tail=50