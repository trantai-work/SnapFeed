name: Deploy UI

on:
  push:
    tags:
      - 'ui-*'

concurrency:
  group: ui
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/snapfeed-ui
          TAG=${GITHUB_REF#refs/tags/}
          docker build \
            --build-arg VITE_API_URL="${{ vars.VITE_API_URL }}" \
            --build-arg VITE_WS_URL="${{ vars.VITE_WS_URL }}" \
            --build-arg VITE_DEFAULT_LANG="${{ vars.VITE_DEFAULT_LANG }}" \
            --build-arg VITE_FACEBOOK_APP_ID="${{ vars.VITE_FACEBOOK_APP_ID }}" \
            --build-arg VITE_FACEBOOK_AUTH_URL="${{ vars.VITE_FACEBOOK_AUTH_URL }}" \
            --build-arg VITE_FACEBOOK_REDIRECT_URI="${{ vars.VITE_FACEBOOK_REDIRECT_URI }}" \
            --build-arg VITE_GOOGLE_AUTH_URL="${{ vars.VITE_GOOGLE_AUTH_URL }}" \
            --build-arg VITE_GOOGLE_CLIENT_ID="${{ vars.VITE_GOOGLE_CLIENT_ID }}" \
            --build-arg VITE_GOOGLE_REDIRECT_URI="${{ vars.VITE_GOOGLE_REDIRECT_URI }}" \
            --build-arg VITE_S3_BUCKET_URL="${{ vars.VITE_S3_BUCKET_URL }}" \
            --build-arg VITE_TURN_SERVER_URL="${{ vars.VITE_TURN_SERVER_URL }}" \
            --build-arg VITE_TURN_USER="${{ vars.VITE_TURN_USER }}" \
            --build-arg VITE_TURN_PASS="${{ vars.VITE_TURN_PASS }}" \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" \
            ./snapfeed-ui
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name sp --region ap-southeast-1

      - name: Deploy UI with Helm
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          helm upgrade snapfeed ./helm/snapfeed -n snapfeed --reuse-values --set ui.image.tag=$TAG