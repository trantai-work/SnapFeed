name: Deploy UI

on:
  push:
    tags:
      - 'ui-*'

concurrency:
  group: ui
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/snapfeed-ui
          TAG=${GITHUB_REF#refs/tags/}
          docker build -t $IMAGE:$TAG ./snapfeed-ui
          docker push $IMAGE:$TAG

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SNAPFEED_EC2_HOST }}
          username: ${{ secrets.SNAPFEED_EC2_USERNAME }}
          key: ${{ secrets.SNAPFEED_EC2_KEY }}
          script: |
            cd /home/ec2-user/SnapFeed

            TAG="${{ github.ref_name }}"
            echo "Deploying UI with TAG=$TAG"

            # Export variable so docker-compose can read it
            export UI_TAG="$TAG"

            # Pull UI image only
            docker-compose pull ui

            # Start UI container
            docker-compose up -d ui

            echo "==== Containers status ===="
            docker ps
            docker-compose logs ui --tail=50